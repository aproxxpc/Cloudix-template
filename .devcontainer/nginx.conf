user nobody nogroup;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 6080 default_server;
        server_name _;

        location = /api/setup-auth {
            proxy_pass http://127.0.0.1:6081/setup-auth;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        location = /api/setup-status {
            proxy_pass http://127.0.0.1:6081/setup-status;
            proxy_set_header Host $host;
        }

        location = /api/health {
            proxy_pass http://127.0.0.1:6081/health;
            proxy_set_header Host $host;
        }

        location = /api/files {
            proxy_pass http://127.0.0.1:6081/files$is_args$args;
            proxy_set_header Host $host;
        }

        location = /api/download {
            proxy_pass http://127.0.0.1:6081/download$is_args$args;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        # 1. Real-Time Live Audio Stream from PulseAudio
        location /audio {
            proxy_pass http://127.0.0.1:6081/;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location /audiows {
            proxy_pass http://127.0.0.1:6081/audiows;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # 1.5 Quick App Launcher & Health API (Terminal, Chrome, etc.)
        location /launch {
            proxy_pass http://127.0.0.1:6081/launch;
            proxy_set_header Host $host;
        }

        # 2. WebSocket for noVNC Video/Input
        location /websockify {
            proxy_pass http://127.0.0.1:6082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # 3. Main noVNC Web Interface
        location / {
            root /usr/share/novnc;
            index vnc_lite.html vnc.html index.html;
            try_files $uri $uri/ /vnc.html;
        }
    }
}
